<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Produk | NSI</title>
  <link rel="icon" type="image/png" href="assets/img/Logo-nusa-saraya-N.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="navbar.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f8f9fa;
      color: #333;
    }

    .hero-detail {
      background: linear-gradient(135deg, #3498db, #2ecc71);
      color: white;
      text-align: center;
      padding: 100px 20px 60px;
    }

    .hero-detail h1 {
      font-weight: 700;
      margin-bottom: 10px;
    }

    .hero-detail p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .product-detail {
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      margin-top: -60px;
      padding: 40px;
    }

    .product-image {
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    .product-specs li {
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .btn-back {
      background: linear-gradient(135deg, #3498db, #2ecc71);
      color: white;
      border-radius: 30px;
      padding: 10px 25px;
      border: none;
      transition: all 0.3s ease;
    }

    .btn-back:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Hero -->
  <section class="hero-detail">
    <div class="container">
      <h1 class="mt-3" id="productName">Nama Produk</h1>
      <p id="productCategory">Kategori Produk</p>
    </div>
  </section>

  <!-- Detail Section -->
  <section class="py-5">
    <div class="container">
      <div class="product-detail mt-3">
        <div class="row align-items-center">
          <div class="col-md-6 mb-4 mb-md-0">
            <div class="product-image">
              <img id="productImage" src="" alt="Product Image" class="img-fluid">
            </div>
          </div>
          <div class="col-md-6">
            <h3 class="fw-bold mb-3" id="productTitle">Judul Produk</h3>
            <p id="productDescription">Deskripsi produk akan tampil di sini.</p>
            <ul id="productSpecs" class="product-specs"></ul>
            <h5 class="mt-4 fw-bold text-success">Harga: <span id="productPrice">Rp -</span></h5>
            <a href="index.html#products" class="btn btn-back mt-4"><i class="fas fa-arrow-left me-2"></i>Kembali ke
              Produk</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    const productData = {

      // ⚡ Electromedics
      ventilator_sh200: {
        name: "Ventilator SH200",
        category: "Electromedics",
        image: "assets/img/product/eshero-ventilator-sh200.jpg",
        description: "Ventilator transport portabel yang dirancang untuk dukungan pernapasan darurat dan transport pasien — cocok untuk penggunaan di UGD, ambulans, dan ruang perawatan intensif ringan.",
        specs: [
          "Tampilan layar TFT 5\" untuk monitoring real-time",
          "Mode ventilasi: VCV, SIMV, CPAP & lainnya",
          "Cocok untuk pasien Dewasa & Pediatrik",
          "Built-in alarm untuk tekanan, apneu & daya",
          "Baterai cadangan untuk penggunaan mobile"
        ],
        price: "± Rp43.500.000 – Rp45.000.000 / unit"
      },

      ventilator_sh300: {
        name: "Ventilator SH300",
        category: "Medical Equipment | Respiratory",
        image: "assets/img/product/eshero-ventilator-sh300.jpg",
        description: "Ventilator medis kelas ICU dengan berbagai mode dukungan pernapasan, dirancang untuk penggunaan di unit intensif, emergensi, dan perawatan kritis pasien dewasa serta pediatrik.",
        specs: [
          "Layar warna besar 10.4'' TFT untuk monitoring real-time",
          "Beragam mode ventilasi seperti VCV, PCV, SIMV, PSV, CPAP, BIPAP",
          "Tidal volume: 20–2500 ml | Respiratory rate: 4–100 bpm",
          "Backup apnea ventilation & built-in alarm safety",
          "Baterai cadangan internal untuk penggunaan saat listrik padam"
        ],
        price: "Rp 80.000.000 – Rp 396.208.000 / unit",
      },
      anaesthesia_machine: {
        name: "Anesthesia Machine AM834",
        category: "Medical Equipment | Anesthesia",
        image: "assets/img/product/anesthesia_machine.jpg",
        description: "Mesin anestesi profesional dengan layar sentuh dan dukungan sumber gas lengkap untuk operasi, klinik, dan fasilitas kesehatan modern.",
        specs: [
          "Layar warna besar (sekitar 12\") dengan interface mudah digunakan",
          "Dukungan tiga sumber gas: O₂, N₂O & udara",
          "Flowmeter presisi tinggi untuk kontrol gas akurat",
          "Cocok untuk pasien Dewasa, Pediatrik & Infant",
          "Monitoring gas real-time & alarm keselamatan"
        ],
        price: "± Rp 364.928.000 / unit"
      },

      // 💉 Disposable
      disposable_examination_gloves: {
        name: "Disposable Examination Gloves",
        category: "Disposable",
        image: "assets/img/product/disposable-examination-gloves.jpg",
        description: "Disposable Examination Gloves merupakan Sarung tangan Gidcare latex sekali pakai yang dibuat dai bahan latex yang berkualitas tinggi, sehingga memiliki tingkat elastisitas yang optimal dan tidak mudah robek. Sarung tangan ini dapat digunakan pada bidang kedokteran ataupun digunakan untuk keperluan sehari-hari. Sudah dibuat sesuai standart ASTM (American Standard). Dapat digunakan untuk tangan kanan maupun kiri, meminimalkan resiko alergi. Memiliki beberapa vaian ukuran yaitu XS, S, M. L. & XL.",
        specs: ["Sebagai alat pelindung baik dibidang kesehatan atau untuk kegiatan sehari-hari", "Dapat meminimalkan resiko alergi", "Isi kemasan 100 Pcs/box.", "Ukuran XS,S,M,L & XL"],
        price: "40.000 / box"
      },
      nurse_cap: {
        name: "Nurse Cap",
        category: "Disposable",
        image: "assets/img/product/nurse-cap.jpg",
        description: "Nurse Cap Gidcare merupakan alat yang berfungsi sebagai pelindung kepala saat melakukan tindakan/aktivitas baik di dunia medis/kedokteran maupun di berbagai aktivitas lainnya, seperti aktivitas di salon, restoran, dapur, laboratorium, fasilitas kesehatan, dll. Melindungi kepala dan rambut, serta mencegah agar tidak terkena tetesan keringat pada saat melakukan aktivitas yang berlangsung sehingga tetap dalam keadaan bersih/steril.",
        specs: ["Double stitched elastic band", "Comfort with tight fit", "Disposable nonwoven", "Liquid resistant", "Isi kemasan 100 Pcs/Box"],
        price: "43.960 / pack"
      },
      surgical_face_mask: {
        name: "Surgical Face Mask",
        category: "Disposable",
        image: "assets/img/product/surgical-face-mask.jpg",
        description: "Masker medis 3-ply dengan BFE ≥98%, tersedia varian Ear Loop, Kids, dan Hijab.",
        specs: [
          "3-ply disposable mask",
          "BFE ≥98%",
          "Nose clip adjustable",
          "Nyaman & breathable"
        ],
        price: "15.000 / box"
      }
    };

    // Ambil parameter dari URL
    const urlParams = new URLSearchParams(window.location.search);
    const productKey = urlParams.get('product');

    // Ambil elemen HTML
    const productName = document.getElementById('productName');
    const productCategory = document.getElementById('productCategory');
    const productImage = document.getElementById('productImage');
    const productTitle = document.getElementById('productTitle');
    const productDescription = document.getElementById('productDescription');
    const productSpecs = document.getElementById('productSpecs');
    const productPrice = document.getElementById('productPrice');

    // Tampilkan data produk sesuai parameter
    if (productData[productKey]) {
      const p = productData[productKey];
      productName.textContent = p.name;
      productCategory.textContent = p.category;
      productTitle.textContent = p.name;
      productImage.src = p.image;
      productDescription.textContent = p.description;
      productPrice.textContent = p.price.toString().includes("Rp") ? p.price : "Rp " + p.price;

      // Tambahkan spesifikasi
      productSpecs.innerHTML = "";
      p.specs.forEach(spec => {
        const li = document.createElement('li');
        li.textContent = spec;
        productSpecs.appendChild(li);
      });
    } else {
      document.querySelector('.product-detail').innerHTML = `
        <div class="text-center p-5">
          <h3>Produk tidak ditemukan 😢</h3>
          <a href="index.html" class="btn btn-back mt-3"><i class="fas fa-arrow-left me-2"></i>Kembali</a>
        </div>`;
    }

    // Tambahkan efek transisi lembut
    document.body.style.opacity = 0;
    window.addEventListener("load", () => {
      document.body.style.transition = "opacity 0.6s ease";
      document.body.style.opacity = 1;
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="navbar.js"></script>
</body>

</html>
